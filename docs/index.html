<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doxmox Changelog</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --line: #dbe3ef;
      --accent: #0b5cab;
      --accent-soft: #e7f1fd;
      --th-bg: #f8fbff;
      --th-text: #1e293b;
      --control-bg: #ffffff;
      --control-line: #c7d2e0;
      --control-text: #0f172a;
      --telegram: #229ed9;
      --telegram-hover: #1d8fc4;
      --telegram-text: #ffffff;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    :root[data-theme="dark"] {
      --bg: #0b1020;
      --card: #0f172a;
      --text: #dbe7ff;
      --muted: #9fb3d1;
      --line: #1e293b;
      --accent: #93c5fd;
      --accent-soft: #111827;
      --th-bg: #111827;
      --th-text: #dbe7ff;
      --control-bg: #111827;
      --control-line: #334155;
      --control-text: #dbe7ff;
      --shadow: 0 10px 30px rgba(2, 6, 23, 0.45);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --bg: #0b1020;
        --card: #0f172a;
        --text: #dbe7ff;
        --muted: #9fb3d1;
        --line: #1e293b;
        --accent: #93c5fd;
        --accent-soft: #111827;
        --th-bg: #111827;
        --th-text: #dbe7ff;
        --control-bg: #111827;
        --control-line: #334155;
        --control-text: #dbe7ff;
        --shadow: 0 10px 30px rgba(2, 6, 23, 0.45);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .toolbar-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-start;
    }
    .toolbar-right {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
    }
    .control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .control select {
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: var(--control-bg);
      color: var(--control-text);
      padding: 6px 8px;
      font-size: 13px;
    }
    .control-btn {
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: var(--control-bg);
      color: var(--control-text);
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .control-btn:hover {
      border-color: var(--accent);
    }
    .admin-status {
      color: var(--muted);
      font-size: 12px;
    }
    .admin-panel {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .admin-panel[hidden] {
      display: none !important;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .head {
      padding: 20px;
      background: var(--accent-soft);
      border-bottom: 1px solid var(--line);
    }
    .telegram-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(13, 90, 127, 0.5);
      background: var(--telegram);
      color: var(--telegram-text) !important;
      font-weight: 600;
      font-size: 15px;
      line-height: 1.2;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(34, 158, 217, 0.35);
      transition: box-shadow 120ms ease, background 120ms ease;
    }
    .telegram-link:hover {
      background: var(--telegram-hover);
      box-shadow: 0 8px 20px rgba(34, 158, 217, 0.45);
    }
    .telegram-link:focus-visible {
      outline: 2px solid rgba(133, 213, 245, 0.9);
      outline-offset: 2px;
    }
    .telegram-link svg {
      width: 22px;
      height: 22px;
      display: block;
      flex: 0 0 auto;
    }
    .telegram-link .tg-icon {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
    }
    .telegram-link .tg-circle {
      fill: #229ed9;
    }
    .telegram-link .tg-plane {
      fill: #ffffff;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 4px 0; color: var(--muted); }
    a { color: var(--accent); }
    .row-remove {
      border: 1px solid var(--control-line);
      border-radius: 6px;
      background: var(--control-bg);
      color: var(--control-text);
      padding: 2px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .row-remove:hover {
      border-color: #dc2626;
      color: #dc2626;
    }
    .row-delete {
      border: 1px solid var(--control-line);
      border-radius: 6px;
      background: var(--control-bg);
      color: var(--control-text);
      padding: 2px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .row-delete:hover {
      border-color: #b91c1c;
      color: #b91c1c;
    }
    .row-select-wrap {
      color: var(--muted);
      font-size: 12px;
      user-select: none;
    }
    .row-select {
      vertical-align: middle;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th {
      background: var(--th-bg);
      color: var(--th-text);
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    code { font-size: 12px; }
    @media (max-width: 860px) {
      .toolbar {
        gap: 8px;
      }
      .toolbar-left {
        width: 100%;
      }
      .toolbar-right {
        width: 100%;
        justify-content: flex-start;
      }
      .telegram-link {
        max-width: 100%;
        width: auto;
        font-size: 14px;
      }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tr { border-bottom: 1px solid var(--line); }
      td {
        border: 0;
        padding: 8px 14px;
      }
    }
    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <div class="toolbar-left">
        <label class="control">
          <span data-i18n="language">Language</span>
          <select id="lang-select">
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="ru">Русский</option>
          </select>
        </label>
        <label class="control">
          <span data-i18n="theme">Theme</span>
          <select id="theme-select">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <span id="admin-panel" class="admin-panel" hidden>
          <button type="button" id="admin-login" class="control-btn" data-i18n="admin_login">Admin login</button>
          <button type="button" id="admin-logout" class="control-btn" data-i18n="admin_logout" hidden>Admin logout</button>
          <button type="button" id="delete-selected" class="control-btn" data-i18n="delete_selected" hidden disabled>Delete selected</button>
          <span id="admin-status" class="admin-status" data-i18n="admin_status_off">Admin: off</span>
        </span>
        <button type="button" id="reset-hidden" class="control-btn" data-i18n="reset_hidden">Reset hidden</button>
      </div>
      <div class="toolbar-right">
        <a class="telegram-link" href="https://t.me/proxmox_update" target="_blank" rel="noopener noreferrer">
          <span class="tg-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle class="tg-circle" cx="12" cy="12" r="11"></circle>
              <path class="tg-plane" d="M17.8 7.2 5.8 11.8c-.8.3-.8.7-.1.9l3 .9 1.2 3.5c.1.4.3.6.6.6.2 0 .4-.1.7-.3l1.7-1.7 2.8 2.1c.5.3 1 .2 1.2-.6l2.1-9c.2-.9-.3-1.3-1.2-1zM10 13.2l5.8-4c.3-.2.6.1.3.3l-4.8 4.5-.2 2 .9-2.8z"></path>
            </svg>
          </span>
          <span data-i18n="subscribe_telegram">Subscribe on Telegram</span>
        </a>
      </div>
    </div>
    <div class="card">
      <div class="head">
        <h1 data-i18n="title">Proxmox VE Admin Guide Changelog</h1>
        <p><span data-i18n="source">Source:</span> <a href="https://pve.proxmox.com/pve-docs/pve-admin-guide.html" target="_blank" rel="noopener noreferrer">https://pve.proxmox.com/pve-docs/pve-admin-guide.html</a></p>
        <p><span data-i18n="generated">Generated (UTC):</span> 2026-04-11T14:56:31Z</p>
      </div>
      <table>
        <thead>
          <tr>
            <th data-i18n="timestamp">Timestamp (UTC)</th>
            <th data-i18n="old_hash">Old Hash</th>
            <th data-i18n="new_hash">New Hash</th>
            <th data-i18n="line_delta">Line Delta</th>
            <th data-i18n="details">Details</th>
          </tr>
        </thead>
        <tbody>
          
          <tr data-empty-row="true" style="display:none;"><td colspan="5" data-i18n="no_changes">No changes detected yet.</td></tr>
        </tbody>
      </table>
    </div>
    <footer class="footer">
      <span data-i18n="footer_by">Designed and implemented by</span>
      <a href="https://vande.fr/" target="_blank" rel="noopener noreferrer">Alexandre VANDEMOORTELE</a>
    </footer>
  </div>
  <script>
    (() => {
      const LANG_KEY = "doxmox-lang";
      const THEME_KEY = "doxmox-theme";
      const HIDDEN_ROWS_KEY = "doxmox-hidden-events";
      const ADMIN_TOKEN_KEY = "doxmox-admin-token";
      const fallbackLang = "en";
      const GITHUB_REPO = "GoXLd/doxmox";
      const GITHUB_REF = "main";
      const GITHUB_ADMIN_WORKFLOW = "history-admin-delete.yml";
      const i18n = {
        en: {
          title: "Proxmox VE Admin Guide Changelog",
          source: "Source:",
          generated: "Generated (UTC):",
          timestamp: "Timestamp (UTC)",
          old_hash: "Old Hash",
          new_hash: "New Hash",
          line_delta: "Line Delta",
          details: "Details",
          view: "View",
          raw: "Raw",
          no_changes: "No changes detected yet.",
          language: "Language",
          theme: "Theme",
          theme_light: "Light",
          theme_dark: "Dark",
          reset_hidden: "Reset hidden",
          hide_entry: "Hide",
          select_entry: "Select",
          delete_entry: "Delete",
          delete_selected: "Delete selected",
          admin_login: "Admin login",
          admin_logout: "Admin logout",
          admin_status_off: "Admin: off",
          admin_status_on: "Admin: {login}",
          admin_bad_token: "Invalid token",
          admin_no_rights: "User is not admin in this repo",
          admin_delete_queued: "Delete queued in GitHub Actions",
          admin_delete_failed: "Delete request failed",
          admin_prompt: "Enter admin access key:",
          delete_confirm: "Delete this entry from history.json?",
          delete_selected_confirm: "Delete selected entries from history.json?",
          footer_by: "Designed and implemented by",
          subscribe_telegram: "Subscribe on Telegram",
          language_en: "English",
          language_fr: "French",
          language_ru: "Russian"
        },
        fr: {
          title: "Journal des changements du guide Proxmox VE Admin",
          source: "Source :",
          generated: "Généré (UTC) :",
          timestamp: "Horodatage (UTC)",
          old_hash: "Ancien hash",
          new_hash: "Nouveau hash",
          line_delta: "Delta de lignes",
          details: "Details",
          view: "Voir",
          raw: "Brut",
          no_changes: "Aucun changement detecte pour le moment.",
          language: "Langue",
          theme: "Theme",
          theme_light: "Clair",
          theme_dark: "Sombre",
          reset_hidden: "Reinitialiser les caches",
          hide_entry: "Masquer",
          select_entry: "Selectionner",
          delete_entry: "Supprimer",
          delete_selected: "Supprimer la selection",
          admin_login: "Connexion admin",
          admin_logout: "Deconnexion admin",
          admin_status_off: "Admin : off",
          admin_status_on: "Admin : {login}",
          admin_bad_token: "Token invalide",
          admin_no_rights: "Cet utilisateur n'est pas admin du repo",
          admin_delete_queued: "Suppression envoyee a GitHub Actions",
          admin_delete_failed: "Echec de la demande de suppression",
          admin_prompt: "Entrez la cle d'acces administrateur :",
          delete_confirm: "Supprimer cette entree de history.json ?",
          delete_selected_confirm: "Supprimer les entrees selectionnees de history.json ?",
          footer_by: "Conçu et réalisé par",
          subscribe_telegram: "S'abonner sur Telegram",
          language_en: "Anglais",
          language_fr: "Français",
          language_ru: "Russe"
        },
        ru: {
          title: "Журнал изменений руководства Proxmox VE Admin",
          source: "Источник:",
          generated: "Сгенерировано (UTC):",
          timestamp: "Временная метка (UTC)",
          old_hash: "Старый хэш",
          new_hash: "Новый хэш",
          line_delta: "Изменение строк",
          details: "Детали",
          view: "Открыть",
          raw: "Raw",
          no_changes: "Изменения пока не обнаружены.",
          language: "Язык",
          theme: "Тема",
          theme_light: "Светлая",
          theme_dark: "Тёмная",
          reset_hidden: "Сбросить скрытые",
          hide_entry: "Скрыть",
          select_entry: "Выбрать",
          delete_entry: "Удалить",
          delete_selected: "Удалить выбранное",
          admin_login: "Вход админ",
          admin_logout: "Выход админ",
          admin_status_off: "Админ: нет",
          admin_status_on: "Админ: {login}",
          admin_bad_token: "Неверный токен",
          admin_no_rights: "Пользователь не админ этого репозитория",
          admin_delete_queued: "Удаление отправлено в GitHub Actions",
          admin_delete_failed: "Ошибка запроса удаления",
          admin_prompt: "Введите ключ доступа администратора:",
          delete_confirm: "Удалить эту запись из history.json?",
          delete_selected_confirm: "Удалить выбранные записи из history.json?",
          footer_by: "Разработано и реализовано",
          subscribe_telegram: "Подписаться в Telegram",
          language_en: "Английский",
          language_fr: "Французский",
          language_ru: "Русский"
        }
      };

      const langSelect = document.getElementById("lang-select");
      const themeSelect = document.getElementById("theme-select");
      const resetHiddenButton = document.getElementById("reset-hidden");
      const adminPanel = document.getElementById("admin-panel");
      const adminLoginButton = document.getElementById("admin-login");
      const adminLogoutButton = document.getElementById("admin-logout");
      const deleteSelectedButton = document.getElementById("delete-selected");
      const adminStatus = document.getElementById("admin-status");
      const tableBody = document.querySelector("tbody");
      const hiddenRows = new Set();
      let adminToken = null;
      let adminPanelUnlocked = false;
      let escHitCounter = 0;
      let escTimer = null;

      function unlockAdminPanel() {
        adminPanelUnlocked = true;
        adminPanel.hidden = false;
      }

      function selectedSelectors() {
        const selected = new Set();
        tableBody.querySelectorAll('tr[data-event-id] .row-select:checked').forEach((checkbox) => {
          const row = checkbox.closest("tr[data-event-id]");
          if (!row) return;
          const selector = row.getAttribute("data-history-selector");
          if (selector) selected.add(selector);
        });
        return [...selected];
      }

      function updateBatchDeleteState() {
        if (!adminToken) {
          deleteSelectedButton.disabled = true;
          return;
        }
        deleteSelectedButton.disabled = selectedSelectors().length === 0;
      }

      function setAdminMode(enabled, login = "") {
        if (enabled) unlockAdminPanel();
        adminPanel.hidden = !adminPanelUnlocked;
        adminLoginButton.hidden = enabled;
        adminLogoutButton.hidden = !enabled;
        deleteSelectedButton.hidden = !enabled;
        document.querySelectorAll('button[data-action="admin-delete"]').forEach((btn) => {
          btn.hidden = !enabled;
        });
        document.querySelectorAll(".row-select-wrap").forEach((node) => {
          node.hidden = !enabled;
        });
        if (!enabled) {
          tableBody.querySelectorAll(".row-select").forEach((checkbox) => {
            checkbox.checked = false;
          });
        }
        const lang = readLang();
        if (enabled) {
          adminStatus.textContent = t(lang, "admin_status_on").replace("{login}", login || "admin");
          adminStatus.dataset.login = login || "admin";
        } else {
          adminStatus.textContent = t(lang, "admin_status_off");
          adminStatus.dataset.login = "";
        }
        updateBatchDeleteState();
      }

      async function githubApiRequest(path, token, method = "GET", payload = null) {
        const response = await fetch(`https://api.github.com${path}`, {
          method,
          headers: {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
            ...(payload ? { "Content-Type": "application/json" } : {})
          },
          body: payload ? JSON.stringify(payload) : undefined
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(`GitHub API ${response.status}: ${text || response.statusText}`);
        }

        if (response.status === 204) return null;
        return response.json();
      }

      async function verifyAdminToken(token) {
        const user = await githubApiRequest("/user", token);
        const repo = await githubApiRequest(`/repos/${GITHUB_REPO}`, token);
        if (!repo.permissions || !repo.permissions.admin) {
          return null;
        }
        return user.login;
      }

      async function loadStoredAdminSession() {
        const token = sessionStorage.getItem(ADMIN_TOKEN_KEY);
        if (!token) {
          setAdminMode(false);
          return;
        }
        try {
          const login = await verifyAdminToken(token);
          if (!login) {
            sessionStorage.removeItem(ADMIN_TOKEN_KEY);
            setAdminMode(false);
            return;
          }
          adminToken = token;
          setAdminMode(true, login);
        } catch {
          sessionStorage.removeItem(ADMIN_TOKEN_KEY);
          setAdminMode(false);
        }
      }

      async function queueHistoryDelete(selector) {
        const normalized = Array.isArray(selector) ? selector : [selector];
        await githubApiRequest(
          `/repos/${GITHUB_REPO}/actions/workflows/${encodeURIComponent(GITHUB_ADMIN_WORKFLOW)}/dispatches`,
          adminToken,
          "POST",
          {
            ref: GITHUB_REF,
            inputs: {
              selectors: normalized.join("\n"),
              delete_artifacts: "false"
            }
          }
        );
      }

      function loadHiddenRows() {
        try {
          const raw = localStorage.getItem(HIDDEN_ROWS_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return;
          parsed.forEach((id) => {
            if (typeof id === "string" && id) hiddenRows.add(id);
          });
        } catch {
          // ignore invalid localStorage payload
        }
      }

      function saveHiddenRows() {
        localStorage.setItem(HIDDEN_ROWS_KEY, JSON.stringify([...hiddenRows]));
      }

      function ensureEmptyRow() {
        let row = tableBody.querySelector('tr[data-empty-row="true"]');
        if (row) return row;
        row = document.createElement("tr");
        row.setAttribute("data-empty-row", "true");
        const cell = document.createElement("td");
        cell.colSpan = 5;
        cell.setAttribute("data-i18n", "no_changes");
        cell.textContent = i18n[fallbackLang].no_changes;
        row.appendChild(cell);
        tableBody.appendChild(row);
        return row;
      }

      function applyHiddenRows() {
        const rows = [...tableBody.querySelectorAll("tr[data-event-id]")];
        let visible = 0;
        rows.forEach((row) => {
          const id = row.getAttribute("data-event-id");
          const isHidden = id && hiddenRows.has(id);
          row.style.display = isHidden ? "none" : "";
          if (isHidden) {
            const checkbox = row.querySelector(".row-select");
            if (checkbox) checkbox.checked = false;
          }
          if (!isHidden) visible += 1;
        });
        const emptyRow = ensureEmptyRow();
        emptyRow.style.display = visible === 0 ? "" : "none";
        updateBatchDeleteState();
      }

      function readLang() {
        const saved = localStorage.getItem(LANG_KEY) || fallbackLang;
        return i18n[saved] ? saved : fallbackLang;
      }

      function readTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === "dark" || saved === "light") {
          return saved;
        }
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }

      function t(lang, key) {
        return (i18n[lang] && i18n[lang][key]) || i18n[fallbackLang][key] || key;
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        themeSelect.value = theme;
      }

      function applyLanguage(lang) {
        document.documentElement.lang = lang;
        langSelect.value = lang;
        document.querySelectorAll("[data-i18n]").forEach((node) => {
          const key = node.getAttribute("data-i18n");
          node.textContent = t(lang, key);
        });
        const langOptions = {
          en: "language_en",
          fr: "language_fr",
          ru: "language_ru"
        };
        for (const option of langSelect.options) {
          option.textContent = t(lang, langOptions[option.value]);
        }
        themeSelect.options[0].textContent = t(lang, "theme_light");
        themeSelect.options[1].textContent = t(lang, "theme_dark");
      }

      const currentLang = readLang();
      const currentTheme = readTheme();
      loadHiddenRows();
      applyLanguage(currentLang);
      applyTheme(currentTheme);
      setAdminMode(false);
      applyHiddenRows();
      loadStoredAdminSession();

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        escHitCounter += 1;
        if (escTimer) clearTimeout(escTimer);
        escTimer = setTimeout(() => {
          escHitCounter = 0;
          escTimer = null;
        }, 1300);
        if (escHitCounter >= 3) {
          unlockAdminPanel();
          escHitCounter = 0;
          if (escTimer) {
            clearTimeout(escTimer);
            escTimer = null;
          }
          setAdminMode(!!adminToken, adminStatus.dataset.login || "");
        }
      });

      tableBody.addEventListener("click", async (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        const button = target.closest('button[data-action]');
        if (!button) return;
        const action = button.getAttribute("data-action");
        const row = button.closest("tr[data-event-id]");
        if (!row) return;

        if (action === "hide-row") {
          const id = row.getAttribute("data-event-id");
          if (!id) return;
          hiddenRows.add(id);
          saveHiddenRows();
          applyHiddenRows();
          return;
        }

        if (action === "admin-delete") {
          if (!adminToken) return;
          const selector = row.getAttribute("data-history-selector");
          if (!selector) return;
          const lang = readLang();
          if (!window.confirm(t(lang, "delete_confirm"))) return;

          button.disabled = true;
          try {
            await queueHistoryDelete([selector]);
            row.style.display = "none";
            applyHiddenRows();
            window.alert(t(lang, "admin_delete_queued"));
          } catch {
            window.alert(t(lang, "admin_delete_failed"));
          } finally {
            button.disabled = false;
          }
        }
      });

      tableBody.addEventListener("change", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        if (!target.matches(".row-select")) return;
        updateBatchDeleteState();
      });

      resetHiddenButton.addEventListener("click", () => {
        hiddenRows.clear();
        localStorage.removeItem(HIDDEN_ROWS_KEY);
        applyHiddenRows();
      });

      deleteSelectedButton.addEventListener("click", async () => {
        if (!adminToken) return;
        const selectors = selectedSelectors();
        if (!selectors.length) return;
        const lang = readLang();
        if (!window.confirm(t(lang, "delete_selected_confirm"))) return;

        deleteSelectedButton.disabled = true;
        try {
          await queueHistoryDelete(selectors);
          tableBody.querySelectorAll('tr[data-event-id] .row-select:checked').forEach((checkbox) => {
            const row = checkbox.closest("tr[data-event-id]");
            if (row) row.style.display = "none";
          });
          applyHiddenRows();
          window.alert(t(lang, "admin_delete_queued"));
        } catch {
          window.alert(t(lang, "admin_delete_failed"));
        } finally {
          updateBatchDeleteState();
        }
      });

      adminLoginButton.addEventListener("click", async () => {
        const lang = readLang();
        const token = window.prompt(t(lang, "admin_prompt")) || "";
        const trimmed = token.trim();
        if (!trimmed) return;

        try {
          const login = await verifyAdminToken(trimmed);
          if (!login) {
            window.alert(t(lang, "admin_no_rights"));
            setAdminMode(false);
            return;
          }
          adminToken = trimmed;
          sessionStorage.setItem(ADMIN_TOKEN_KEY, trimmed);
          setAdminMode(true, login);
        } catch {
          window.alert(t(lang, "admin_bad_token"));
          setAdminMode(false);
        }
      });

      adminLogoutButton.addEventListener("click", () => {
        adminToken = null;
        sessionStorage.removeItem(ADMIN_TOKEN_KEY);
        setAdminMode(false);
      });

      langSelect.addEventListener("change", () => {
        localStorage.setItem(LANG_KEY, langSelect.value);
        applyLanguage(langSelect.value);
      });

      themeSelect.addEventListener("change", () => {
        localStorage.setItem(THEME_KEY, themeSelect.value);
        applyTheme(themeSelect.value);
      });
    })();
  </script>
</body>
</html>
