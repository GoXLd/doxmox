name: Admin Delete History Entry

on:
  workflow_dispatch:
    inputs:
      selectors:
        description: "History selectors (newline-separated timestamps or diff filenames)"
        required: true
        type: string
      delete_artifacts:
        description: "Also delete related docs/changes artifacts (.diff, .html, .changelog.html)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: doxmox-history-admin-delete
  cancel-in-progress: false

jobs:
  delete-history-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Delete history entry
        run: |
          ARGS=()
          while IFS= read -r line; do
            selector="$(echo "$line" | xargs)"
            if [ -z "$selector" ]; then
              continue
            fi
            ARGS+=("--history-delete" "$selector")
          done <<'EOF'
          ${{ inputs.selectors }}
          EOF

          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "No selectors provided."
            exit 1
          fi

          if [ "${{ inputs.delete_artifacts }}" = "true" ]; then
            ARGS+=("--history-delete-artifacts")
          fi
          python src/monitor.py "${ARGS[@]}"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/history.json docs

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: delete history entries via admin workflow"
          git push
