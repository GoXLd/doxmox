name: Monitor Proxmox Admin Guide

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doxmox-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
          CLOUDFLARE_VECTORIZE_INDEX: ${{ secrets.CLOUDFLARE_VECTORIZE_INDEX }}
        run: |
          ARGS=(--ai-enable --vectorize-namespace "doxmox-admin-guide")
          if [ -n "${CLOUDFLARE_VECTORIZE_INDEX}" ]; then
            ARGS+=(--vectorize-index "${CLOUDFLARE_VECTORIZE_INDEX}")
          fi
          python src/monitor.py "${ARGS[@]}"

      - name: Read monitor result
        id: result
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("data/last_result.json").read_text(encoding="utf-8"))
          short_summary = str(result.get("short_summary") or "").replace("\n", " ").strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"changed={str(result.get('changed', False)).lower()}\n")
              out.write(f"bootstrap={str(result.get('bootstrap', False)).lower()}\n")
              out.write(f"diff_file={result.get('diff_file') or ''}\n")
              out.write(f"added_lines={result.get('added_lines', 0)}\n")
              out.write(f"removed_lines={result.get('removed_lines', 0)}\n")
              out.write("short_summary<<EOF\n")
              out.write(f"{short_summary}\n")
              out.write("EOF\n")
          PY

      - name: Commit and push artifacts
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/latest.html data/state.json docs

          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: update monitor artifacts ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          git push

          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        if: steps.result.outputs.changed == 'true' && steps.result.outputs.bootstrap != 'true' && steps.commit.outputs.committed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOMAIN: ${{ secrets.DOMAIN }}
          DIFF_FILE: ${{ steps.result.outputs.diff_file }}
          ADDED: ${{ steps.result.outputs.added_lines }}
          REMOVED: ${{ steps.result.outputs.removed_lines }}
          SHORT_SUMMARY: ${{ steps.result.outputs.short_summary }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ] || [ -z "$DOMAIN" ]; then
            echo "Required secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, DOMAIN) are not configured; skipping notification."
            exit 0
          fi

          DOMAIN="${DOMAIN#https://}"
          DOMAIN="${DOMAIN#http://}"
          DOMAIN="${DOMAIN%/}"
          BASE_URL="https://${DOMAIN}"
          PUBLIC_DIFF_PATH="${DIFF_FILE#docs/}"
          DIFF_PAGE_PATH="${PUBLIC_DIFF_PATH%.diff}.html"
          DIFF_URL="${BASE_URL}/${DIFF_PAGE_PATH}"
          CHANGELOG_URL="${BASE_URL}/index.html"
          DIFF_BASENAME="$(basename "${DIFF_FILE}" .diff)"
          if [[ "${DIFF_BASENAME}" =~ ^([0-9]{4})([0-9]{2})([0-9]{2})T([0-9]{2})([0-9]{2})[0-9]{2}Z$ ]]; then
            HOUR="${BASH_REMATCH[4]#0}"
            if [ -z "${HOUR}" ]; then HOUR="0"; fi
            DIFF_LABEL="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}-${HOUR}:${BASH_REMATCH[5]}"
          else
            DIFF_LABEL="Open diff"
          fi
          SUMMARY_ESCAPED="$(python - <<'PY'
          import html
          import os
          print(html.escape((os.environ.get("SHORT_SUMMARY") or "").strip()))
          PY
          )"
          TEXT="Proxmox Admin Guide changed."
          if [ -n "${SUMMARY_ESCAPED}" ]; then
            TEXT="${TEXT}"$'\n'"${SUMMARY_ESCAPED}"
          fi
          TEXT="${TEXT}"$'\n'"+${ADDED} / -${REMOVED}"
          TEXT="${TEXT}"$'\n'"Diff: <a href=\"${DIFF_URL}\">${DIFF_LABEL}</a>"
          TEXT="${TEXT}"$'\n'"<a href=\"${CHANGELOG_URL}\">Full changelog</a>"

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML" >/dev/null
