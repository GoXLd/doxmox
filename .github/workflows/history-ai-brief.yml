name: Admin AI Brief History

on:
  workflow_dispatch:
    inputs:
      selectors:
        description: "History selectors (newline-separated timestamps or diff filenames)"
        required: false
        type: string
      all_entries:
        description: "Process all entries with existing EN summary"
        required: false
        default: false
        type: boolean
      force:
        description: "Regenerate even if compact summary already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: doxmox-history-ai-brief
  cancel-in-progress: false

jobs:
  ai-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate compact summaries
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
        run: |
          ARGS=(--ai-enable --history-ai-brief-all)
          HAS_SELECTOR=false

          if [ "${{ inputs.all_entries }}" = "true" ]; then
            ARGS=(--ai-enable --history-ai-brief-all)
            HAS_SELECTOR=true
          else
            ARGS=(--ai-enable)
            while IFS= read -r line; do
              selector="$(echo "$line" | xargs)"
              if [ -z "$selector" ]; then
                continue
              fi
              ARGS+=("--history-ai-brief" "$selector")
              HAS_SELECTOR=true
            done <<'EOF'
          ${{ inputs.selectors }}
          EOF
          fi

          if [ "${HAS_SELECTOR}" != "true" ]; then
            echo "No selectors provided and all_entries=false."
            exit 1
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=(--history-ai-brief-force)
          fi

          python src/monitor.py "${ARGS[@]}"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json docs

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: generate compact changelog summaries"
          git push
